function parseCSV(t){const rows=[];let i=0,n=t.length,row=[];while(i<n){let v;
  if(t[i]==='"'){let j=i+1;v='';for(;;){const k=t.indexOf('"',j);if(k<0){v+=t.slice(j);i=n;break}if(t[k+1]==='"'){v+=t.slice(j,k+1);j=k+2}else{v+=t.slice(j,k);i=k+1;break}}}
  else{let k=i;while(k<n&&t[k]!==','&&t[k]!=='\n')k++;v=t.slice(i,k).replace('\r','');i=k}
  row.push(v);
  if(t[i]===','){i++;if(i>=n){row.push('');rows.push(row)}}else{if(t[i]==='\r')i++;if(t[i]==='\n')i++;rows.push(row);row=[]}}
 return rows}

prog(){const T=S.tot,den=r=>r[C.billed]+r[C.unbilled];const mx=Math.max(...S.days.map(d=>d[1]));
 $('#p').innerHTML=`<h2>📈 PROGRESS REPORT</h2><p class="d">Billing and collection progress for October 2026, up to ${S.asof}.</p>
 <div class="tiles">${tile('BILLING PROGRESS',(T.billed/(T.billed+T.unbilled)*100).toFixed(1)+'%',N(T.billed)+' of '+N(T.billed+T.unbilled))+tile('COLLECTED IN OCT',R(T.paidamt),N(T.paidn)+' consumers paid')+tile('COLLECTION vs PAYABLE',(T.paidamt/T.pay*100).toFixed(2)+'%','of '+R(T.pay))+tile('COLLECTION vs CURRENT BILL',(T.paidamt/T.ca*100).toFixed(1)+'%','of '+R(T.ca))}</div>
 <div class="grid2"><div class="box"><h3>BILLING PROGRESS BY SUB-DIVISION</h3>${pct(S.sdo,r=>r[0],r=>r[C.billed],den)}<h3 style="margin-top:16px">COLLECTION IN OCT BY SUB-DIVISION</h3>${bars(S.sdo,r=>r[0],r=>r[C.paidamt]+r[C.upaidamt],'g',R)}</div>
 <div class="box"><h3>BILLS GENERATED PER DAY</h3>${S.days.map(d=>`<div class="bar"><span>${d[0]}</span><i class="p" style="width:${d[1]/mx*100}%"></i><b>${N(d[1])} · ${R(d[2])}</b></div>`).join('')}<h3 style="margin-top:16px">OCT PAYMENTS BY MODE (BILLED CONSUMERS)</h3>${bars(S.mode,r=>r[0].trim(),r=>r[2],'g',R)}</div></div>
 <div class="grid2"><div class="box"><h3>BILLING PROGRESS BY SUBSTATION</h3>${pct(S.ss.filter(r=>den(r)>50),r=>r[0],r=>r[C.billed],den)}</div>
 <div class="box"><h3>LOWEST 20 FEEDERS BY BILLING PROGRESS (200+ CONSUMERS)</h3>${pct(S.fd.filter(r=>den(r)>=200).sort((a,b)=>a[C.billed]/den(a)-b[C.billed]/den(b)).slice(0,20),r=>r[0],r=>r[C.billed],den)}</div></div>`},
set(){$('#p').innerHTML=`<h2>⚙️ SETTINGS</h2><p class="d">Data, PINs and saved ATR entries on this device.</p>
 <div class="note">Dashboard and Progress Report use the summary built into this page from the 08-OCT-2026 files. Search, Defaulters, Calling, Field Visit and Map need the consumer files, which stay on this device. ${RECS?N(RECS.length)+' consumer records are currently loaded.':'No consumer records are loaded yet.'}</div>
 ${loader('Load a fresh daily export here to replace the consumer records.')}
 <div class="row"><button class="btn warn" id="x-data">🗑 REMOVE CONSUMER RECORDS FROM THIS DEVICE</button><button class="btn warn" id="x-pin">🔑 RESET ALL PINS</button><button class="btn warn" id="x-atr">🧾 CLEAR SAVED ATR ENTRIES</button></div><div class="info" id="x-msg">Each button asks you to press it twice.</div>`;
 bindLoader();const twice=(id,fn,done)=>{let armed=0;$(id).onclick=()=>{if(!armed){armed=1;$('#x-msg').textContent='Press the same button again to confirm.';setTimeout(()=>armed=0,4000);return}fn();$('#x-msg').textContent=done;armed=0}};
 twice('#x-data',()=>{RECS=null;BYID=null;idb('del').catch(()=>{})},'Consumer records removed.');
 twice('#x-pin',()=>ls.set('pins',{}),'PINs reset. Each role will ask for a new PIN at next login.');
 twice('#x-atr',()=>{LOGS.calls=[];LOGS.visits=[];LOGS.pushed=[];saveLogs()},'Saved ATR entries cleared.')}
};
lreset();
</script>

</body></html>
